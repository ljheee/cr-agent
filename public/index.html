<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CR-Agent · AI Code Review</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a2f42;--fg:#e8eaf2;--mut:#8b93a8;--acc:#5b8cff;--ok:#3ecf8e;--warn:#ffb86b;--bad:#ff6b81;--p0:#ff4d6d;--p1:#ff9840;--p2:#ffd166;--p3:#8b93a8;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
header h1{font-size:16px;margin:0}
header nav{display:flex;gap:6px;margin-left:auto}
header nav button{background:none;border:1px solid var(--line);color:var(--mut);padding:5px 14px;border-radius:8px;cursor:pointer}
header nav button.active{color:var(--fg);border-color:var(--acc);background:rgba(91,140,255,.12)}
main{max-width:1080px;margin:0 auto;padding:26px 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 22px;cursor:pointer;font:inherit;font-weight:600}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit}
.row{display:flex;gap:12px}.row>*{flex:1}
.tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.tag.P0{color:var(--p0);border-color:var(--p0)}.tag.P1{color:var(--p1);border-color:var(--p1)}.tag.P2{color:var(--p2);border-color:var(--p2)}.tag.P3{color:var(--p3);border-color:var(--p3)}
.tag.pass{color:var(--ok);border-color:var(--ok)}.tag.fail{color:var(--bad);border-color:var(--bad)}
.tag.new{color:var(--acc);border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);text-align:left;font-weight:500;padding:7px 9px;border-bottom:1px solid var(--line)}
td{padding:7px 9px;border-bottom:1px solid rgba(42,47,66,.5)}
.progress{background:var(--panel2);border-radius:10px;padding:14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;max-height:260px;overflow:auto;color:var(--mut)}
.progress .stage-ok{color:var(--ok)}
.finding{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;background:var(--panel2)}
.finding .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.finding .file{font-family:ui-monospace,monospace;font-size:12px;color:var(--acc);cursor:pointer}
.finding pre{background:#0b0d13;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px}
.mut{color:var(--mut)}.small{font-size:12px}
summary{cursor:pointer;color:var(--acc);font-size:13px}
#reportView h2{margin:0 0 4px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px}
.pill b{display:block;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.exempt-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.exempt-form>*{flex:1}
.error{color:var(--bad)}
details.raw pre{white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:400px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>⚡ CR-Agent</h1>
  <span class="mut small">pi-coding-agent · 21 审查视角 · 7 步流程</span>
  <nav>
    <button data-view="submit" class="active">提交 CR</button>
    <button data-view="reports">报告列表</button>
    <button data-view="ledgers">问题账本</button>
    <button data-view="settings">设置</button>
  </nav>
</header>
<main id="app"></main>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const app = $('#app');

/* ───────── 视图路由 ───────── */
let view='submit';
$$('nav button').forEach(b=>b.onclick=()=>{
  view=b.dataset.view;
  $$('nav button').forEach(x=>x.classList.toggle('active',x===b));
  render();
});

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||r.status);
  return j;
}

let pollTimer=null;

async function render(){
  // 切换视图前停止进行中的进度轮询，避免后台泄漏与旧 DOM 更新
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(view==='submit') return renderSubmit();
  if(view==='settings') return renderSettings();
  if(view==='reports') return renderReports();
  if(view==='ledgers') return renderLedgers();
}

/* ───────── 提交 CR ───────── */
async function renderSubmit(){
  app.innerHTML=`
  <div class="card">
    <h2 style="margin-top:0">提交 PR 链接，触发 AI Code Review</h2>
    <p class="mut small">支持 GitHub / GitLab / Bitbucket(含 Bitbucket Server/Stash) 的 PR/MR 链接。首次全量审查，新 commit 提交同一链接将走增量复审（问题跨轮闭环）。</p>
    <label>PR 链接</label>
    <input id="prUrl" placeholder="https://github.com/owner/repo/pull/123">
    <div class="row" style="margin-top:10px;align-items:flex-end">
      <div><label>模型（留空用默认）</label><select id="mSel"><option value="">默认</option></select></div>
      <div><label>推理强度</label><select id="tSel"><option>high</option><option>medium</option><option>xhigh</option></select></div>
      <div style="flex:0"><label>选项</label><label style="display:flex;gap:6px;align-items:center;color:var(--fg);cursor:pointer"><input type="checkbox" id="forceFull" style="width:auto"> 强制全量重审</label></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
      <button class="primary" id="goBtn">开始审查</button>
      <span class="mut small" id="goHint"></span>
    </div>
  </div>
  <div class="card" id="progCard" style="display:none">
    <b>执行进度</b>
    <div class="progress" id="prog"></div>
  </div>
  <div id="reportView"></div>`;
  // 加载模型列表
  try{
    const s=await api('/api/settings');
    $('#mSel').innerHTML='<option value="">默认（'+esc(s.defaultModel||'未设置')+'）</option>'+
      (s.models||[]).map(m=>`<option value="${esc(m.id)}">${esc(m.name||m.id)}</option>`).join('');
    if(!s.models?.length) $('#goHint').textContent='⚠ 设置页未配置模型';
    if(!s.hasApiKey) $('#goHint').textContent='⚠ 未配置 API Key，请先到设置页';
  }catch(e){}
  $('#goBtn').onclick=()=>startReview();
}

async function startReview(){
  const url=$('#prUrl').value.trim();
  if(!url) return alert('请输入 PR 链接');
  $('#goBtn').disabled=true;
  $('#progCard').style.display='';
  const prog=$('#prog');
  prog.innerHTML='';
  try{
    const {reviewId}=await api('/api/review',{url,forceFull:$('#forceFull').checked,model:$('#mSel').value||undefined,thinking:$('#tSel').value});
    // 提交成功立即可见：告知已受理与各阶段预期时长（resolve 静默期长是正常现象，勿误判未提交）
    prog.innerHTML=`<div>✓ 已提交（${esc(reviewId)}），正在拉取 PR 信息…<br><span class="mut small">resolve 阶段可能静默 1–5 分钟（无 token 时走 git 模式较慢）；出现 [agent] start 后进入模型审查。</span></div>`;
    // 轮询进度
    let done=false;
    let pollFails=0;
    const t0=Date.now();
    const timer=setInterval(async()=>{
      try{
        const p=await api(`/api/review/${reviewId}/progress`);
        pollFails=0;
        prog.innerHTML=p.events.map(e=>{
          const st=e.status==='done'||e.status==='ok'?'stage-ok':'';
          const det=e.pr?` ${esc(e.pr.repo)}#${esc(e.pr.number)}`:e.mode?` mode=${esc(e.mode)}`:e.model?` ${esc(e.model)}`:e.error?` <span class="error">${esc(e.error)}</span>`:'';
          return `<div class="${st}">[${e.stage}] ${e.status}${det}</div>`;
        }).join('\n');
        if(p.agentEventsDropped)prog.innerHTML+=`<div class="small mut">（${p.agentEventsDropped} 条 agent 事件超限丢弃）</div>`;
        // resolve 阶段静默超过 3 分钟：给出诊断提示（代码平台不可达/未配 token 常见）
        const hasResolveDone=p.events.some(e=>e.stage==='resolve'&&e.status==='done');
        if(!hasResolveDone&&!p.done&&Date.now()-t0>3*60*1000){
          prog.innerHTML+=`<div class="small" style="color:#c80">⚠ 拉取 PR 信息已超 3 分钟：目标机到该代码平台的网络可能受限（或未配置平台 token），仍在重试中（git 兑底最长约 10 分钟）…</div>`;
        }
        if(p.done){
          clearInterval(timer);pollTimer=null;
          $('#goBtn').disabled=false;
          if(p.error){prog.innerHTML+=`<div class="error">✗ ${esc(p.error)}${p.errorStatus===429?'（轮次上限，需人工确认）':''}</div>`;return;}
          const rep=await api(`/api/reports/${p.reportId}`);
          $('#reportView').innerHTML=renderReport(rep);
        }
      }catch(e){ /* 单次失败重试，连续 5 次才终止（防首次瞬时网络抖动） */
        if(++pollFails>=5&&pollTimer){clearInterval(pollTimer);pollTimer=null;$('#goBtn').disabled=false;prog.innerHTML+=`<div class="error">✗ 进度查询连续失败：${esc(e.message)}</div>`;}
      }
    },1500);
    pollTimer=timer;
  }catch(e){
    $('#goBtn').disabled=false;
    prog.innerHTML=`<div class="error">${esc(e.message)}</div>`;
  }
}

/* ───────── 报告渲染（分层：作者摘要 → 完整 findings → 原始 JSON） ───────── */
function renderReport(r){
  const sevTag=s=>`<span class="tag ${s}">${s}</span>`;
  const evTag=l=>l==='test-confirmed'?'<span class="tag pass">测试实证</span>':l==='test-falsified'?'<span class="tag P3">测试证伪</span>':l==='code-confirmed'?'<span class="tag">代码实证</span>':l==='unverified'?'<span class="tag">未验证</span>':'';
  const findingHtml=f=>`
    <div class="finding">
      <div class="head">${sevTag(f.severity)}<b>${esc(f.title)}</b>
        <span class="tag">${esc(f.category||'')}</span>
        ${evTag(f.evidence_level)}
        ${f.introduced_by==='pre-existing'?'<span class="tag">存量'+(f.pre_existing_detected==='programmatic'?'（程序判定）':'')+'</span>':''}
        ${f.duplicates>1?`<span class="tag">×${f.duplicates} 桶命中</span>`:''}
        ${f.line_adjusted?'<span class="tag">行号校正</span>':''}
        ${f.confidence!=null?`<span class="tag">置信 ${(f.confidence*100)|0}%</span>`:''}
        <span class="file" title="查看代码">${esc(f.file)}${f.line?':'+esc(f.line):''}</span></div>
      ${f.code_snippet?`<pre>${esc(f.code_snippet)}</pre>`:''}
      ${f.evidence?`<p class="small"><b class="mut">证据：</b>${esc(f.evidence)}</p>`:''}
      ${f.evidence_level==='unverified'&&f.evidence_gap?`<p class="small mut">证据缺口：${esc(f.evidence_gap)}</p>`:''}
      ${f.impact?`<p class="small"><b class="mut">影响：</b>${esc(f.impact)}</p>`:''}
      ${f.suggestion?`<p class="small"><b style="color:var(--ok)">修复建议：</b>${esc(f.suggestion)}</p>`:''}
    </div>`;
  const summary=r.author_summary||{};
  const must=summary.must_fix||[], should=summary.should_fix||[], nice=summary.nice_to_have||[];
  return `
  <div class="card">
    <h2>${esc(r.conclusion)} ${esc(r.pr?.title||r.pr?.repo||'')} 
      <span class="mut small" style="font-weight:400">${esc(r.pr?.repo)}#${esc(r.pr?.number)} · round ${esc(r.review?.round)} · ${esc(r.review?.mode)}${r.review?.fast_path?' · fast-path':''} · ${esc(r.review?.model||'')} · ${((r.review?.elapsed_ms||0)/1000).toFixed(0)}s</span></h2>
    <p>${esc(r.one_line||'')}</p>
    <p class="mut small">${esc(r.impact_summary||'')}</p>
    <div class="pill-row">
      <div class="pill"><b>${r.findings?.length||0}</b>新问题</div>
      <div class="pill"><b>${(r.findings||[]).filter(f=>f.severity==='P0'||f.severity==='P1').length}</b>P0/P1</div>
      <div class="pill"><b>${r.review?.previous_findings?.length||0}</b>历史复核</div>
      <div class="pill"><b>${(r.decision_changes||[]).length}</b>跨仓查证</div>
      <div class="pill"><b>${r.metrics?.perspectives_covered?.length||0}/${esc(r.review?.fast_path?'6':'21')}</b>视角覆盖</div>
      ${r._toolCalls?`<div class="pill"><b>${r._toolCalls}</b>工具调用</div>`:''}
      ${r.ledger_stats?.adoption_rate!=null?`<div class="pill"><b>采纳率 ${(r.ledger_stats.adoption_rate*100)|0}%</b></div>`:''}
      ${r.review?.review_bundles?.length||r.review_bundles?.length?`<div class="pill"><b>${(r.review_bundles||r.review.review_bundles).length}</b>分桶</div>`:''}
      ${r.review?.needs_human_reason?`<div class="pill"><b>轮次上限</b>需人工</div>`:''}
    </div>
    ${r.blockers?.length?`<p class="small"><b style="color:var(--bad)">阻塞项：</b>${r.blockers.map(esc).join(', ')}</p>`:''}
  </div>
  <div class="card">
    <b>作者摘要</b>（必改 ${must.length} / 建议 ${should.length} / 可选 ${nice.length}）
    ${must.length?`<h4 style="color:var(--bad);margin-bottom:6px">⛔ 必改</h4>${must.map(f=>`<p class="small">· ${sevTag(f.severity)} <b>${esc(f.title)}</b> <span class="file">${esc(f.where||'')}</span><br>&nbsp;&nbsp;${esc(f.suggestion||'')}</p>`).join('')}`:''}
    ${should.length?`<h4 style="color:var(--warn);margin-bottom:6px">⚠ 建议修复</h4>${should.map(f=>`<p class="small mut">· <b>${esc(f.title)}</b> ${esc(f.where||'')}</p>`).join('')}`:''}
    ${r.release_plan?.preconditions?.length?`<h4 style="margin-bottom:6px">🚀 上线前置</h4><p class="small">${r.release_plan.preconditions.map(esc).join('<br>')}</p>`:''}
    ${r.release_plan?.rollback?.length?`<h4 style="margin-bottom:6px">↩ 回滚预案</h4><p class="small">${r.release_plan.rollback.map(esc).join('<br>')}</p>`:''}
  </div>
  <div class="card">
    <b>问题明细</b>
    ${(r.findings||[]).map(findingHtml).join('')||'<p class="mut">无</p>'}
  </div>
  ${(r.review?.previous_findings||[]).length?`<div class="card"><b>历史问题复核</b><table><tr><th>ID</th><th>状态</th><th>说明</th></tr>
    ${r.review.previous_findings.map(p=>`<tr><td>${esc(p.id||'')}</td><td>${p.status==='fixed'?'<span class="tag pass">已修复</span>':p.status==='still_exists'?'<span class="tag P1">仍存在</span>':'<span class="tag">'+esc(p.status)+'</span>'}</td><td class="small">${esc(p.note||'')}</td></tr>`).join('')}</table></div>`:''}
  ${(r.decision_changes||[]).length?`<div class="card"><b>跨仓查证</b><table><tr><th>Trace</th><th>判定点</th><th>状态</th><th>证据</th></tr>
    ${r.decision_changes.map(d=>`<tr><td>${esc(d.trace_id)}</td><td class="small">${esc(d.decision||'')}</td><td>${statusTag(d.status)}</td><td class="small mut">${esc((d.evidence||'').slice(0,120))}</td></tr>`).join('')}</table></div>`:''}
  ${(r.tests||[]).length?`<div class="card"><b>测试建议</b>${r.tests.map(t=>`<p class="small">· [${esc(t.priority)}] ${esc(t.scenario)} <span class="mut">${esc(t.why||'')}</span></p>`).join('')}</div>`:''}
    ${(r.verification?.degraded_steps||[]).length?`<div class="card"><b>降级步骤声明</b>${r.verification.degraded_steps.map(s=>`<p class="small">· ${esc(s)}</p>`).join('')}</div>`:''}
    ${(r.checked_paths||[]).length?`<div class="card"><b>已检查路径（${r.checked_paths.length}）</b><p class="small mut">${r.checked_paths.map(esc).join('、')}</p></div>`:''}
    <div class="card details raw"><details><summary>原始 JSON 报告</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details></div>`;
}
const statusTag=s=>s==='consistent'?'<span class="tag pass">一致</span>':s==='conflicting'?'<span class="tag P0">冲突</span>':s==='needs_human'?'<span class="tag P1">需人工</span>':'<span class="tag">未验证</span>';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ───────── 报告列表 ───────── */
async function renderReports(){
  app.innerHTML='<div class="card"><b>审查报告</b><div id="rlist"><p class="mut">加载中…</p></div></div>';
  try{
    const list=await api('/api/reports');
    if(!list.length) return $('#rlist').innerHTML='<p class="mut">暂无报告，先去提交一个 PR</p>';
    $('#rlist').innerHTML=`<table><tr><th>时间</th><th>PR</th><th>结论</th><th>轮次</th><th>问题</th><th>模型</th><th></th></tr>
      ${list.map(x=>`<tr><td class="small">${esc((x.at||'').slice(0,19).replace('T',' '))}</td><td>${esc(x.repo)}#${esc(x.pr)}</td>
      <td>${x.conclusion==='通过'?'<span class="tag pass">通过</span>':'<span class="tag fail">不通过</span>'}</td>
      <td>r${esc(x.round)} ${x.mode==='incremental'?'增量':'全量'}${''}</td>
      <td>${esc(x.findings)}（P0/P1:${esc(x.p0p1)}）</td><td class="small mut">${esc(x.model||'')}</td>
      <td><button class="ghost" data-rep="${esc(x.id)}">查看</button></td></tr>`).join('')}</table>`;
    $('#rlist').querySelectorAll('button[data-rep]').forEach(b=>b.onclick=()=>viewReport(b.dataset.rep));
  }catch(e){$('#rlist').innerHTML=`<p class="error">${esc(e.message)}</p>`}
}
window.viewReport=async id=>{
  const r=await api(`/api/reports/${id}`);
  let rp=document.getElementById('rp');
  if(!rp){rp=document.createElement('div');rp.id='rp';app.appendChild(rp);}
  rp.innerHTML=`${renderReport(r)}<button class="ghost" onclick="document.getElementById('rp').remove()">关闭</button>`;
  window.scrollTo(0,document.body.scrollHeight);
};

/* ───────── 问题账本 ───────── */
async function renderLedgers(){
  app.innerHTML='<div class="card"><b>PR 审查账本</b><p class="mut small">问题跨轮闭环：open/still_exists 持续跟踪，fixed 闭环；豁免后不再重复报告；查证失败 2 轮自动升级 needs_human。</p><div id="llist"><p class="mut">加载中…</p></div></div>';
  try{
    const list=await api('/api/ledger');
    if(!list.length) return $('#llist').innerHTML='<p class="mut">暂无账本</p>';
    $('#llist').innerHTML=list.map((l,i)=>`
      <details data-led="${i}" style="margin:8px 0"><summary>${esc(l.repo)}#${esc(String(l.pr))} — ${esc(String(l.stats.rounds))} 轮 · open ${esc(String(l.stats.open))} · fixed ${esc(String(l.stats.fixed))} · needs_human ${esc(String(l.stats.needs_human))} · 豁免 ${esc(String(l.stats.exempt))}</summary>
      <div class="small" style="padding:8px 14px">
        ${(l.stats.by_severity&&Object.entries(l.stats.by_severity).map(([k,v])=>`<span class="tag ${k}">${k}:${v}</span>`).join(' '))||''}
        <div class="ldetail" data-repo="${esc(l.repo)}" data-pr="${esc(String(l.pr))}"><p class="mut">展开加载问题明细…</p></div>
      </div></details>`).join('');
    // 展开时拉取该 PR 完整账本：findings 明细 + 豁免管理
    $$('#llist details[data-led]').forEach(d=>d.addEventListener('toggle',()=>{
      if(!d.open) return;
      const box=d.querySelector('.ldetail');
      if(box.dataset.loaded) return;
      loadLedgerDetail(box);
    }));
  }catch(e){$('#llist').innerHTML=`<p class="error">${esc(e.message)}</p>`}
}
async function loadLedgerDetail(box){
  box.dataset.loaded='1';
  const repo=box.dataset.repo, pr=box.dataset.pr;
  try{
    const l=await api(`/api/ledger?repo=${encodeURIComponent(repo)}&pr=${encodeURIComponent(pr)}`);
    const fs=(l.findings||[]).map(f=>`
      <div class="row small" style="align-items:center;margin:2px 0">
        <span class="tag ${esc(f.severity)}">${esc(f.severity)}</span>
        <span style="flex:2">${esc(f.persist_id)} ${esc(f.title)} <span class="mut">(${esc(f.status)}${f.file?` · ${esc(f.file)}:${esc(String(f.line??''))}`:''})</span></span>
        ${f.status!=='fixed'&&f.status!=='not_applicable'?`<button class="ghost" data-exf="${esc(f.file||'')}" data-ext="${esc(f.title.slice(0,40))}" style="flex:0">豁免</button>`:''}
      </div>`).join('')||'<p class="mut">无问题记录</p>';
    const exs=(l.exempt||[]).map((e,i)=>`
      <div class="row small" style="align-items:center;margin:2px 0">
        <span style="flex:2">豁免：${esc(e.file||'(任意文件)')}${e.title_keyword?` · 关键词「${esc(e.title_keyword)}」`:''}${e.reason?` · ${esc(e.reason)}`:''} <span class="mut">by ${esc(e.exempted_by||'user')}</span></span>
        <button class="ghost" data-exdel="${i}" style="flex:0">移除</button>
      </div>`).join('')||'<p class="mut">暂无豁免项</p>';
    box.innerHTML=`<p style="margin:8px 0 2px"><b>问题明细</b></p>${fs}<p style="margin:8px 0 2px"><b>豁免清单</b></p>${exs}`;
    box.querySelectorAll('button[data-exf]').forEach(b=>b.onclick=async()=>{
      const reason=prompt(`豁免 ${b.dataset.exf||'该文件'} 的「${b.dataset.ext}」？输入原因（可选）：`,'');
      if(reason===null) return;
      try{
        await api('/api/ledger/exempt',{method:'POST',body:{repo,pr:Number(pr),file:b.dataset.exf||undefined,titleKeyword:b.dataset.ext,reason:reason||'前端豁免',exemptedBy:'web'}});
        delete box.dataset.loaded; loadLedgerDetail(box);
      }catch(e){alert('豁免失败：'+e.message)}
    });
    box.querySelectorAll('button[data-exdel]').forEach(b=>b.onclick=async()=>{
      if(!confirm('移除该豁免项？')) return;
      try{
        await api('/api/ledger/exempt',{method:'DELETE',body:{repo,pr:Number(pr),index:Number(b.dataset.exdel)}});
        delete box.dataset.loaded; loadLedgerDetail(box);
      }catch(e){alert('移除失败：'+e.message)}
    });
  }catch(e){box.innerHTML=`<p class="error">${esc(e.message)}</p>`}
}

/* ───────── 设置页 ───────── */
async function renderSettings(){
  app.innerHTML='<div class="card"><b>设置</b><p class="mut small">AIGC 端点（OpenAI 兼容）与模型管理。凭证仅存本地 data/settings.json。</p><div id="sbody"><p class="mut">加载中…</p></div></div>';
  let s;
  try{ s=await api('/api/settings'); }catch(e){ return $('#sbody').innerHTML=`<p class="error">${esc(e.message)}</p>`; }
  const pers=await api('/api/perspectives').catch(()=>[]);
  let modelSeq=0;
  const modelRowHtml=m=>{const i=modelSeq++;
    return `<div class="row" style="align-items:center;margin:4px 0">
      <input data-mi="${i}" data-mf="id" value="${esc(m.id)}" placeholder="model id（如 gpt-4o / deepseek-chat / 自定义名称）">
      <input data-mi="${i}" data-mf="name" value="${esc(m.name||'')}" placeholder="显示名">
      <input data-mi="${i}" data-mf="contextWindow" value="${esc(String(m.contextWindow||128000))}" style="flex:.5">
      <button class="ghost" data-mdel="${i}" style="flex:0">删除</button>
    </div>`};
  $('#sbody').innerHTML=`
    <div class="row"><div>
      <label>端点 Base URL（OpenAI 兼容）</label>
      <input id="sBaseUrl" value="${esc(s.baseUrl)}" placeholder="https://api.openai.com/v1（任意 OpenAI 兼容端点）">
    </div><div>
      <label>Provider ID</label>
      <input id="sProviderId" value="${esc(s.providerId)}">
    </div></div>
    <label>API Key / Token（Bearer）${s.hasApiKey?'<span class="tag pass">已配置</span>':''}</label>
    <input id="sApiKey" type="password" placeholder="${s.hasApiKey?'留空则不修改':'sk-xxx 或 SSO token'}">
    <div class="row" style="margin-top:10px"><div>
      <label>默认模型</label>
      <select id="sDefaultModel">${(s.models||[]).map(m=>`<option value="${esc(m.id)}" ${m.id===s.defaultModel?'selected':''}>${esc(m.name||m.id)}</option>`).join('')}</select>
    </div><div>
      <label>默认推理强度</label>
      <select id="sThinking"><option ${s.defaultThinking==='high'?'selected':''}>high</option><option ${s.defaultThinking==='medium'?'selected':''}>medium</option><option ${s.defaultThinking==='xhigh'?'selected':''}>xhigh</option></select>
    </div></div>
    <div style="margin:14px 0;display:flex;gap:10px">
      <button class="primary" id="sSave">保存</button>
      <button class="ghost" id="sFetchModels">从端点拉取模型</button>
      <button class="ghost" id="sAddModel">手动添加模型</button>
      <button class="ghost" id="sTest">测试端点</button>
    </div>
    <label>模型列表（${(s.models||[]).length} 个）</label>
    <div id="modelList">${(s.models||[]).map(modelRowHtml).join('')||'<p class="mut small">暂无模型</p>'}</div>
    <div style="margin-top:18px">
      <b class="small">审查视角（${pers.length} 个，其中新增 ${pers.filter(p=>p.isNew).length} 个）</b>
      <div class="grid" style="margin-top:8px">${pers.map(p=>`<div class="pill">${esc(p.name)} ${p.isNew?'<span class="tag new">新增</span>':''}<span class="mut small">· ${p.dimension} · 权重${p.weight}</span></div>`).join('')}</div>
    </div>
    <p class="mut small" style="margin-top:18px">环境变量：CR_AGENT_DATA（数据目录）· PORT（服务端口）。密钥保存于 data/pi-home/auth.json（自动生成）。</p>`;

  const collectModels=()=>{
    const ids=$$('#modelList input[data-mf="id"]');
    return ids.map((el,i)=>({
      id:el.value.trim(),
      name:$(`#modelList input[data-mi="${el.dataset.mi}"][data-mf="name"]`).value.trim()||el.value.trim(),
      contextWindow:Number($(`#modelList input[data-mi="${el.dataset.mi}"][data-mf="contextWindow"]`).value)||128000,
    })).filter(m=>m.id);
  };
  $('#sSave').onclick=async()=>{
    try{
      const body={baseUrl:$('#sBaseUrl').value.trim(),providerId:$('#sProviderId').value.trim()||'custom',
        defaultModel:$('#sDefaultModel').value,defaultThinking:$('#sThinking').value,models:collectModels()};
      const k=$('#sApiKey').value.trim(); if(k) body.apiKey=k;
      const r=await api('/api/settings',{method:'PUT',body});
      alert('已保存'); renderSettings();
    }catch(e){alert('保存失败：'+e.message)}
  };
  $('#sFetchModels').onclick=async()=>{
    try{
      const body={baseUrl:$('#sBaseUrl').value.trim(),providerId:$('#sProviderId').value.trim()||'custom'};
      const k=$('#sApiKey').value.trim(); if(k) body.apiKey=k;
      await api('/api/settings',{method:'PUT',body});
      const r=await api('/api/settings/models/fetch',{method:'POST',body:{}});
      const cur=collectModels(); const curIds=new Set(cur.map(m=>m.id));
      r.models.forEach(id=>{if(!curIds.has(id))cur.push({id,name:id})});
      $('#modelList').innerHTML=cur.map(modelRowHtml).join('');
      bindDelete();
      alert(`拉取到 ${r.models.length} 个模型，已合并到列表（点击保存生效）`);
    }catch(e){alert('拉取失败：'+e.message+'\n（可手动添加模型）')}
  };
  $('#sAddModel').onclick=()=>{
    $('#modelList').insertAdjacentHTML('beforeend',modelRowHtml({id:'',name:'',contextWindow:128000}));
    bindDelete();
  };
  const bindDelete=()=>{$$('#modelList button[data-mdel]').forEach(b=>b.onclick=()=>{b.closest('.row').remove()})};
  bindDelete();
  $('#sTest').onclick=async()=>{
    try{
      const body={baseUrl:$('#sBaseUrl').value.trim()};
      const k=$('#sApiKey').value.trim(); if(k) body.apiKey=k;
      await api('/api/settings',{method:'PUT',body});
      const r=await api('/api/settings/test',{method:'POST',body:{model:$('#sDefaultModel').value}});
      alert(`端点可用 ✓ 模型 ${r.model}\n${r.sample}`);
    }catch(e){alert('测试失败：'+e.message)}
  };
}
render();
</script>
</body>
</html>
